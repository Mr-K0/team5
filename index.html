<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="game-container">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="screen active">
            <h1 class="game-title">Quiz Master Game</h1>
            <div class="character-container">
                <div class="cartoon-character">
                    <div class="character-body">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                            <div class="bow-tie"></div>
                            <div class="suit-collar"></div>
                        </div>
                        <div class="desk"></div>
                        <div class="monitor"></div>
                    </div>
                    <div class="speech-bubble">
                        <p>Welcome! Ready to test your knowledge?</p>
                    </div>
                </div>
            </div>
            
            <div class="menu-options">
                <div class="category-selection">
                    <h3>Select Category:</h3>
                    <select id="categorySelect">
                        <option value="general">General Knowledge</option>
                        <option value="programming">Programming</option>
                        <option value="history">History</option>
                        <option value="politics">Politics</option>
                        <option value="science">Science</option>
                        <option value="sports">Sports</option>
                    </select>
                </div>
                
                <div class="difficulty-selection">
                    <h3>Select Difficulty:</h3>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn" data-difficulty="easy">Easy (3 Questions)</button>
                        <button class="difficulty-btn" data-difficulty="medium">Medium (5 Questions)</button>
                        <button class="difficulty-btn" data-difficulty="hard">Hard (10 Questions)</button>
                    </div>
                </div>
                
                <button id="startGame" class="start-btn">Start Game</button>
            </div>
        </div>
        
        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="score-display">Score: <span id="currentScore">0</span></div>
                <div class="question-counter">Question: <span id="currentQuestion">1</span>/<span id="totalQuestions">3</span></div>
            </div>
            
            <div class="character-container">
                <div class="cartoon-character">
                    <div class="character-body">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                            <div class="bow-tie"></div>
                            <div class="suit-collar"></div>
                        </div>
                        <div class="desk"></div>
                        <div class="monitor"></div>
                    </div>
                    <div class="speech-bubble">
                        <p id="characterQuestion">Loading question...</p>
                    </div>
                </div>
            </div>
            
            <div class="question-container">
                <h2 id="questionText">Question will appear here...</h2>
                <div class="options-container" id="optionsContainer">
                    <!-- Options will be dynamically added here -->
                </div>
                
                <button id="nextButton" class="next-btn" style="display: none;">Next Question</button>
            </div>
            
            <div class="appreciation-message" id="appreciationMessage"></div>
        </div>
        
        <!-- Score Screen -->
        <div id="scoreScreen" class="screen">
            <h1 class="game-title">Game Over!</h1>
            <div class="character-container">
                <div class="cartoon-character">
                    <div class="character-body">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                            <div class="bow-tie"></div>
                            <div class="suit-collar"></div>
                        </div>
                        <div class="desk"></div>
                        <div class="monitor"></div>
                    </div>
                    <div class="speech-bubble">
                        <p id="finalMessage">Great job!</p>
                    </div>
                </div>
            </div>
            
            <div class="scoreboard">
                <h2>Final Score</h2>
                <div class="score-details">
                    <div class="score-item">
                        <span class="label">Total Questions:</span>
                        <span id="totalQuestionsScore">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Correct Answers:</span>
                        <span id="correctAnswers">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Final Score:</span>
                        <span id="finalScore">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Percentage:</span>
                        <span id="percentage">0%</span>
                    </div>
                </div>
                
                <div class="performance-badge" id="performanceBadge">
                    <span id="badgeText">Good Effort!</span>
                </div>
            </div>
            
            <button id="playAgain" class="play-again-btn">Play Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
